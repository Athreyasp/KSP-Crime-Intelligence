<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KSP Crime Intelligence & Analytical Platform</title>
    <meta name="description" content="Strategic intelligence console for the Karnataka State Police State Crime Records Bureau — hotspots, networks, predictive insights." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://static.zohocdn.com/catalyst/web/v2/catalystWebJS.js"></script>
    <script>
      // Initialize Catalyst Web SDK — handles auth session automatically
      window.__catalystReady = new Promise(function(resolve) {
        try {
          // Initialize catalyst app without forcing authentication redirect
          var app = catalyst.init();
          resolve(app);
        } catch(e) {
          console.warn("Catalyst SDK init skipped (likely local dev):", e.message);
          resolve(null);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
